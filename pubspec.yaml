name: zentrip
description: Zentrip — AI-powered travel companion app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # State & Navigation
  go_router: ^14.2.7

  # Storage & Prefs
  shared_preferences: ^2.3.2

  # Location & Maps
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Networking
  dio: ^5.7.0

  # Push Notifications (Firebase Cloud Messaging فقط — Auth والبيانات لسه في Laravel)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # تسجيل دخول اجتماعي
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # الدفع — بوابات MENA (HyperPay/PayTabs/Telr) بتشتغل بصفحة دفع مستضافة (Hosted
  # Checkout) بتتفتح جوه WebView، مش SDK مباشر زي Stripe.
  webview_flutter: ^4.10.0

  # مشاركة الرحلة (نص/رابط) وQR الخاص بالتذكرة
  share_plus: ^10.1.2
  qr_flutter: ^4.1.0

  # مزامنة مع تقويم الجهاز
  device_calendar: ^4.3.3

  # الوضع بدون إنترنت — رصد حالة الاتصال (التخزين نفسه بيستخدم نفس نظام
  # SharedPreferences المستخدم في باقي التطبيق، مفيش داعي لمكتبة تخزين إضافية)
  connectivity_plus: ^6.1.0

  # مزامنة التقويم محتاجة نظام timezone صريح
  timezone: ^0.9.4

  # Image & File
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  flutter_rating_bar: ^4.0.1
  dotted_line: ^3.2.2
  pinput: ^5.0.0
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_gen_runner: ^5.7.0

dependency_overrides:
  intl: ^0.20.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/