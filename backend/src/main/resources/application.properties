spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.application.name=zentrip-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/zentrip?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jackson.serialization.write-dates-as-timestamps=false

serpapi.key=${SERPAPI_KEY:}
requesty.api-key=${REQUESTY_API_KEY:}
requesty.model=${REQUESTY_MODEL:google/gemma-4-31b-it}
app.admin.email=${APP_ADMIN_EMAIL:}
app.partner.accounts=${APP_PARTNER_ACCOUNTS:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB